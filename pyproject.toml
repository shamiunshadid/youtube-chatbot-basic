[project]
name = "youtube-chatbot-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shamiun Shadid", email = "shamiunshadid@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "python-dotenv>=1.2.4",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
youtube-chatbot-rag = "youtube_chatbot_rag:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
